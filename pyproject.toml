[project]
name = "iaqf-svb-reproduction"
version = "1.0.0"
description = "Reproduction code for the IAQF 2026 stablecoin dislocation study"
readme = "README.md"
requires-python = "==3.12.4"
dependencies = [
    "bottleneck==1.3.7",
    "jinja2==3.1.4",
    "matplotlib==3.8.4",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "pillow==10.3.0",
    "pyarrow==22.0.0",
    "pyparsing==3.1.2",
    "requests==2.33.1",
    "scipy==1.15.3",
    "seaborn==0.13.2",
    "statsmodels==0.14.5",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "ruff==0.14.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
filterwarnings = [
    "error",
    "ignore:Jupyter is migrating its paths.*:DeprecationWarning:jupyter_client.connect",
]
markers = [
    "golden: exact artifacts on the pinned macOS reference environment",
    "integration: end-to-end pipeline reproduction",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]
